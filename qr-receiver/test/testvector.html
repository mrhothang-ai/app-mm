<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%231b5e9c%22/%3E%3Ctext x=%2216%22 y=%2221%22 font-size=%2213%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22%3EQR%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm thử ILSQ v1</title>
<style>
body{margin:0;background:#f4f6f8;color:#1f2733;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
h1{font-size:19px;margin:0 0 4px}.sub{color:#6b7a8d;font-size:13px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid #e3e8ef;border-radius:12px;overflow:hidden}
td{padding:8px 10px;border-bottom:1px solid #e3e8ef;vertical-align:top}td small{color:#6b7a8d;display:block;word-break:break-word}
.ok{color:#1a8f4c;font-weight:800}.bad{color:#c4461f;font-weight:800}
#sum{font-size:22px;font-weight:800;margin:12px 0}
</style>
</head>
<body>
<h1>Kiểm thử trình nhận ILSQ v1</h1>
<div class="sub">Test vector mục 11.1 · ca T1–T8 mục 11.2 · delta mục 7. <span id="env"></span></div>
<div id="sum">Đang chạy…</div>
<table id="t"></table>
<script src="../lib/pako.min.js"></script>
<script src="../ilsq.js"></script>
<script src="cases.js"></script>
<script>
document.getElementById('env').textContent = window.isSecureContext ? '' : '⚠ Không phải HTTPS/localhost: crypto.subtle không có → các ca cần SHA-256 sẽ KHÔNG ĐẠT.';
runIlsqTests(ILSQ, u8 => pako.inflateRaw(u8)).then(rs => {
  document.getElementById('t').innerHTML = rs.map(r => `<tr><td class="${r.pass ? 'ok' : 'bad'}">${r.pass ? 'ĐẠT' : 'KHÔNG ĐẠT'}</td><td><b>${r.id}</b></td><td>${r.name}<small>${r.detail.replace(/</g, '&lt;')}</small></td></tr>`).join('');
  const bad = rs.filter(r => !r.pass).length;
  const s = document.getElementById('sum'); s.textContent = bad ? `${bad}/${rs.length} ca KHÔNG ĐẠT` : `ĐẠT ${rs.length}/${rs.length}`; s.className = bad ? 'bad' : 'ok';
}).catch(e => { document.getElementById('sum').textContent = 'Lỗi: ' + e.message; });
</script>
</body>
</html>
